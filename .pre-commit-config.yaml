# Credential checks only. Enable once per clone:
#
#   uvx pre-commit install      (or: pipx run pre-commit install)
#
# This is the control that actually prevents a leak. The repository is public,
# so once a commit is pushed the secret is public; the `secret scan` job in
# .github/workflows/ci.yml runs after that and can only report it.
#
# Revisions below are kept current by Dependabot's `pre-commit` ecosystem (see
# .github/dependabot.yml).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Catches PEM-format keys only. Broader credential detection is gitleaks,
      # below; filename-shaped credentials are the local hook at the bottom.
      - id: detect-private-key

  # Content-shaped secrets in the staged diff, using the Earthdata Login rules
  # in .gitleaks.toml. Worth bumping ci.yml's pinned image to match when
  # Dependabot moves this rev, though a release of lag costs nothing but a
  # slightly older ruleset.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Name-shaped credentials. .gitignore already lists these patterns, but
      # .gitignore stops accidents, not `git add -f`.
      - id: forbid-credential-filenames
        name: forbid credential-shaped filenames
        language: fail
        entry: >-
          Refusing to commit a credential-shaped file. Earthdata Login and cloud
          credentials belong in a local ~/.netrc or in GitHub Actions secrets,
          never in the repository.
        files: '(^|/)(\.netrc|_netrc|\.env)$|(^|/)\.env\..*$|\.(pem|key|p12|pfx|keystore|jks)$'
        exclude: '(^|/)\.env\.example$'
