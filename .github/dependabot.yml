# Automated dependency updates (DUCS-12).
#
# Each ecosystem opens at most one grouped PR per week.
#
# Times use an odd minute deliberately. Everybody's default is :00, which
# piles every scheduled job in the world onto the same instant.
#
# `cooldown` holds back releases younger than a week. When a package is
# compromised, the malicious version is typically pulled within days — a cooldown
# means the repo never adopts it.
version: 2
updates:
  # Keeps the SHA pins in .github/workflows/ current. Dependabot rewrites both
  # the SHA and the trailing `# vX.Y.Z` comment, which is what makes pinning by
  # digest maintainable rather than a chore nobody does.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:43"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      github-actions:
        patterns: ["*"]

  # Hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
      day: tuesday
      time: "06:47"
      timezone: Etc/UTC
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      pre-commit:
        patterns: ["*"]
