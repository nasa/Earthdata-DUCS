# Developer-facing checks on pull requests and pushes to main.
#
# Scope: this workflow keeps the *pipeline codebase* healthy. It is NOT
# the DUCS generate/validate pipeline and NOT scheduled re-validation.
# Those will be separate workflows with different triggers.
#
# Intentionally secret-free, so it should run fine on pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

# Least privilege.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede in-flight runs for the same ref, except on main: that run is the
  # recorded result for a commit that is already merged, so let it finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: lint & workflow audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's token in .git/config for later steps to reach.
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      # Hook environments are the slow part, not the checks themselves. Keyed on
      # the config so a Dependabot rev bump correctly invalidates the cache.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: pre-commit-

      # --locked matters here: plain `uv run` would quietly re-lock a uv.lock
      # that had drifted from pyproject.toml, and CI would pass on a lockfile
      # nobody committed.
      - name: Run all hooks
        env:
          # The gitleaks hook only ever scans the *staged* diff -- that flag is
          # baked into its hook definition rather than passed as an argument --
          # and nothing is staged in CI. The `secrets` job scans instead.
          SKIP: gitleaks
        run: uv run --locked --group dev pre-commit run --all-files --show-diff-on-failure

  # This job cannot prevent a leak. The repository is public, so a pushed secret
  # is already public before the job starts, and `pre-commit install` is the only
  # control that runs early enough to stop one. This is the backstop for whoever
  # never installed the hooks, or used `git commit --no-verify`.
  #
  # It earns its place because it is the only detection that exists: per
  # .gitleaks.toml, GitHub's own secret scanning cannot see Earthdata Login
  # credentials. Treat anything it reports as already compromised -- rotate the
  # credential first, worry about history second.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `dir` scans the checked-out tree rather than git history, which is what
      # keeps this to a single command: no full clone, no commit-range
      # arithmetic. It still flags a secret on the pull request that introduces
      # it, and unlike a history scan it cannot wedge the repo -- that would fail
      # every unrelated PR once one secret landed, even after the credential was
      # rotated, until someone rewrote history or added a .gitleaksignore.
      #
      # The version is duplicated from .pre-commit-config.yaml, deliberately:
      # Dependabot cannot reach a tag inside a `run:` block, and if this lags the
      # hook by a release the only cost is a slightly older ruleset. The official
      # gitleaks-action is not used because it demands a GITLEAKS_LICENSE for
      # org-owned repos, even public ones, and is not open-source licensed.
      #
      # --redact keeps findings out of the public log: the exit code and file
      # location are what a contributor needs, not the secret itself. --config is
      # explicit so this cannot silently fall back to the default ruleset and
      # drop the Earthdata Login rules.
      - name: Scan the checkout for secrets
        run: |
          docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 \
            dir --no-banner --redact --verbose --config .gitleaks.toml .
