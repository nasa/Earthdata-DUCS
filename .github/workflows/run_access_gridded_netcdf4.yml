# Runs the access_gridded_netcdf4 python script in a Github Workflows environment
#
# 9/11/2026 JRS with ChatGSFC
# Uses the gridded_netcdf4.yml environment

name: Run MERRA-2 Data Script

# This determines when the script runs.
# workflow_dispatch allows you to manually trigger it from the GitHub Actions tab.
on:
  workflow_dispatch:
  # Uncomment the lines below if you want it to run every time you push to main
  # push:
  #   branches:
  #     - main

# Least privilege: this job only reads the repo. Earthdata credentials arrive
# through secrets, not through the job token.
permissions:
  contents: read

jobs:
  run-data-script:
    runs-on: ubuntu-latest

    # We must explicitly tell GitHub to use the Conda shell
    defaults:
      run:
        shell: bash -l {0}

    steps:
      # Actions are pinned to a commit SHA, not a tag: a tag can be moved to
      # point at different code. Dependabot keeps the SHA and the trailing
      # version comment current (see .github/dependabot.yml).
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Don't leave the job's token in .git/config for later steps to reach.
          persist-credentials: false

      - name: Set up Conda Environment
        uses: conda-incubator/setup-miniconda@8ee1f361103df19b6f8c8655fd3967a8ecb162d5 # v4.0.1
        with:
          activate-environment: gridded_netcdf4
          environment-file: envs/gridded_netcdf4.yml
          auto-activate-base: false
          miniforge-version: latest

      - name: Run MERRA-2 Python Script
        # We pass the Earthdata credentials as environment variables
        # so earthaccess.login() can find them automatically.
        env:
          EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
          EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
        run: |
          python prototype/access_gridded_netcdf4.py
